                <h3>Royer Pérez Jiménez</h3>
                <ul>
                    <li>Edad: 19</li>
                    <li>Nacionalidad: mexicana</li>
                    <li>Fecha de fallecimiento: 16 de marzo de 2026</li>
                    <p>Royer tenía 19 años y venía de San Juan Chamula, una comunidad maya tzotzil 
                        de las montañas de Chiapas. Fue arrestado en enero de 2026 por la policía 
                        local en Florida, y ICE lo puso bajo su custodia el 21 de febrero. 
                        Los cargos en su contra son motivo de discrepancia se asociaron 
                        con fraude. El 26 de febrero lo trasladaron al Glades County Detention 
                        Center. A las 2:34 de la madrugada del 16 de marzo, un guardia lo encontró 
                        inconsciente. ICE dice que fue un presunto suicidio pero su padre, Manuel Perez Ruiz, 
                        había hablado con él tres días antes y lo escuchó bien. Para traer su cuerpo 
                        de vuelta tuvieron que pedir ayuda económica. El 4 de abril fue sepultado en Chiapas, 
                        entre decenas de personas, mientras su madre lloraba sobre el ataúd.</p>
