                        <p>Originario de San Juan Chamula, una comunidad maya tzotzil de las montañas de Chiapas. Fue arrestado en enero de 2026 por la policía local en Florida. ICE lo puso bajo su custodia el 21 de febrero. Los cargos en su contra son motivo de discrepancia y se asociaron con fraude. El 26 de febrero lo trasladaron al Glades County Detention Center. A las 2:34 de la madrugada del 16 de marzo, un guardia lo encontró inconsciente. ICE alega un presunto suicidio. Su padre, Manuel Perez Ruiz, habló con él tres días antes y lo escuchó bien. Para repatriar su cuerpo tuvieron que pedir ayuda económica. El 4 de abril fue sepultado en Chiapas, entre decenas de personas, mientras su madre lloraba sobre el ataúd.</p>

                </figure>

            <article class="case-item">

                    <figcaption>
                        <h2>Mohammad Nazeer Paktyawal</h2>
                        <ul class="case-metadata">
                        <li><strong>Edad:</strong> 41</li>
                        <li><strong>Nacionalidad:</strong> afgana</li>
                        <li><strong>Fecha de fallecimiento:</strong> 14 de marzo de 2026</li>
                        </ul>
                        <p>Mohammad era padre de seis hijos; el menor tenía apenas 18 meses. Durante más de diez años combatió junto a las fuerzas especiales del Ejército de EE. UU. en Afganistán. En 2021, Estados Unidos lo evacuó con su familia. Trabajaba en una panadería en Richardson, Texas, para sostener a los suyos mientras esperaba una respuesta a su solicitud de asilo. El 13 de marzo, hacia las 7 de la mañana, agentes de ICE lo detuvieron afuera de su casa, justo cuando iba a llevar a sus hijos a la escuela. ICE justificó el arresto con acusaciones por fraude de beneficios alimentarios y robo, aunque tenía condena. Esa noche sintió dolor en el pecho y falta de aire, y lo llevaron al Parkland Hospital de Dallas. Murió a la mañana siguiente, tras hinchársele la lengua mientras desayunaba. <em>“Sus hijos siguen preguntando cuándo volverá su papá”</em>, dijo su familia.</p>
                    </figcaption>
                </figure>
            </article>

                        <p>Su hermano, Presly Nelson, lo recuerda como un hombre tranquilo y compasivo que amaba a su familia, las fiestas y la música haitiana. Emmanuel vivía en Dorchester, Massachusetts, y había llegado a EE. UU.  dos años antes mediante un programa humanitario. ICE lo detuvo en Boston en septiembre de 2025, tras un arresto de la policía local por agresión; su hermano insiste en que no era un criminal. Lo enviaron al Florence Correctional Center, en Arizona, donde siguió preso incluso después de que le negaran el asilo. A mediados de febrero dijo que le dolía una muela. De acuerdo con su familia nunca lo llevaron al dentista. La infección empeoró y terminó en cuidados intensivos. Su familia no pudo verlo hasta sus últimos días. ICE ha disputado parte de este relato, y legisladores calificaron el caso de <em>“altamente prevenible”</em>.</p>

                        <p>Geraldo llegó a Estados Unidos en 1996 y vivió más de veinte años en Rochester, Nueva York, donde crió a sus cuatro hijos. ICE lo arrestó el 14 de julio de 2025 en una operación planificada y desde septiembre estaba en Camp East Montana, en El Paso, Texas. Vivía con enfermedades mentales. Según reportes de prensa, llegó a golpearse la cabeza contra una pared por no poder pagar las llamadas para hablar con sus hijos. El 3 de enero de 2026 murió allí. Testigos relataron que lo oyeron decir <em>“no puedo respirar”</em> mientras lo sujetaban los guardias. ICE sostuvo que intentó quitarse la vida, pero el médico forense de El Paso dictaminó homicidio por asfixia por la compresión del cuello y el torso. Las autoridades lo describieron como delincuente sexual registrado, algo que su hija rechaza: ella lo recuerda como un buen padre.</p>
